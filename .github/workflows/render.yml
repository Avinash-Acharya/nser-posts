name: Render Hindi reel

# Runs when Avinash's PC pushes the Hindi voice for reels (posts/<date>-<slot>/voice/manifest.json).
on:
  push:
    paths:
      - "posts/*/voice/manifest.json"
  workflow_dispatch:
    inputs:
      date:
        description: "post folder name(s), e.g. 2026-11-12-11am (space separated)"
        required: true

concurrency:
  group: render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Which reels
        id: day
        run: |
          if [ -n "${{ inputs.date }}" ]; then D="${{ inputs.date }}"
          else D=$(git diff --name-only HEAD~1 HEAD -- 'posts/*/voice/manifest.json' | cut -d/ -f2 | sort -u | tr '\n' ' '); fi
          [ -z "$D" ] && echo "no reel found" && exit 1
          echo "d=$D" >> $GITHUB_OUTPUT; echo "Rendering: $D"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        timeout-minutes: 12
        run: |
          which ffmpeg || { timeout 240 sudo apt-get update -q || true; timeout 400 sudo apt-get install -y -q --no-install-recommends ffmpeg; }
          ffmpeg -version | head -1
          pip install -q numpy soundfile scipy
          ls -la /usr/bin/google-chrome* || true
          # the old studio engine needs playwright; paper reels use the runner's own Chrome
          if grep -L '"style": *"paper"' $(for X in ${{ steps.day.outputs.d }}; do echo posts/$X/post.json; done) | grep -q .; then
            pip install -q playwright && timeout 300 python -m playwright install --with-deps chromium; fi
      - name: Render
        run: |
          export CHROME=/usr/bin/google-chrome
          for X in ${{ steps.day.outputs.d }}; do
            D=posts/$X
            if grep -q '"style": *"paper"' $D/post.json; then
              python engine/paper/render.py $D
            else
              python poster/fetch_media.py $X || echo "media fetch failed, rendering without"
              python engine/tts.py $D none && python engine/render_explainer.py $D && mv $D/reel/reel.mp4 $D/reel.mp4
            fi
            rm -rf $D/reel
          done
      - name: Commit the reel
        run: |
          git config user.name "nser render bot"
          git config user.email "actions@users.noreply.github.com"
          for X in ${{ steps.day.outputs.d }}; do git add posts/$X/reel.mp4; git add posts/$X/media 2>/dev/null || true; done
          git commit -m "Reels: ${{ steps.day.outputs.d }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
