<!doctype html>
<html><head><meta charset="utf-8">
<!-- STUDIO reel (saasflash-like, nser theme): warm greige set, black-and-white real photos / clips with a yellow
     colour-pop (3D clay Nib, highlights), floating extruded cards, phone + monitor mockups, chat bubbles,
     whip-pan cuts with motion blur, film grain. Pure function of time: window.render(t) (returns a promise that
     resolves when every image on screen is decoded). window.EV = sound cues. -->
<style>
  @font-face{font-family:"Geist";src:url(fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900}
  @font-face{font-family:"Fraunces";src:url(fonts/Fraunces.ttf)}
  @font-face{font-family:"Deva";src:url(fonts/NotoSansDevanagari.ttf)}
  :root{--bg:#E9E2D6;--ink:#1F1D1A;--mut:#8D857A;--y:#FFD23F;--y2:#E9A800;--card:#FFFDF8}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
  body{font-family:"Geist","Deva",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .abs{position:absolute}
  .layer{position:absolute;inset:0;overflow:hidden}
  .bw{filter:grayscale(1) contrast(1.12) brightness(.98)}
  .card{background:var(--card);border-radius:30px;border:4px solid #1F1D1A;box-shadow:10px 12px 0 rgba(31,29,26,.14)}
  .bub{background:#fff;border-radius:30px;padding:24px 36px;font:600 56px/1.2 Geist,Deva;border:4px solid #1F1D1A;box-shadow:8px 10px 0 rgba(31,29,26,.12)}
  .acc{color:var(--y2)}
  .hl{background:linear-gradient(transparent 55%,var(--y) 55%,var(--y) 92%,transparent 92%)}
  #wm{left:80px;top:210px;font:600 30px/1 Geist;color:var(--mut);z-index:40;letter-spacing:-.01em}
  #cap{left:90px;right:90px;top:1500px;font:600 44px/1.3 Geist,Deva;z-index:40;text-align:center}
  #grain{position:absolute;inset:0;z-index:50;pointer-events:none;opacity:.09;mix-blend-mode:multiply}
  #vig{position:absolute;inset:0;z-index:49;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(60,45,25,.18))}
</style>
<script src="mascot.js"></script></head>
<body>
<div id="A" class="layer"></div>
<div id="B" class="layer"></div>
<div id="wm" class="abs">@nser.in_officials</div>
<div id="cap" class="abs"></div>
<div id="vig"></div>
<svg id="grain" width="1080" height="1920"><filter id="gn"><feTurbulence id="gt" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1920" filter="url(#gn)"/></svg>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-clamp(x),3), eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eb=x=>{x=clamp(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<span class="acc">$1</span>');
const fmt=n=>Math.round(n).toLocaleString('en-IN');
const $=id=>document.getElementById(id);
let T=null, POST=null, SCN=[], MEDIA={};

// ---- media: a photo, or one frame of a clip (frames pre-extracted by the renderer) ----
function mediaSrc(i,lt){ const m=MEDIA[i]; if(!m) return '';
  if(m.kind==='video'){ const f=1+Math.min(m.n-1, Math.floor(lt*30)%m.n); return `${POST._dir}${m.frames}/${String(f).padStart(4,'0')}.jpg`; }
  return POST._dir+m.src; }
function mediaFill(b,lt,o={}){ const src=mediaSrc(b.i,lt); if(!src) return `<div class="layer" style="background:linear-gradient(160deg,#D9D1C3,#CFC6B6)"></div>`;
  const z=(o.zoom||1.08)+.06*P(lt,0,b.dur+.4);
  return `<img class="abs bw" src="${src}" style="left:0;top:0;width:1080px;height:1920px;object-fit:cover;transform:scale(${z});transform-origin:50% 45%;${o.blur?`filter:grayscale(1) contrast(1.1) blur(${o.blur}px) brightness(1.05)`:''}">`; }
const nib=(o,lt,at=.3)=>{ if(!o) return ''; const p=eb(P(lt,at,at+.45)), bob=Math.sin(lt*2.6)*8;
  return `<div class="abs" style="left:${o.x??330}px;top:${o.y??700}px;transform:translateY(${(1-p)*160+bob}px) scale(${.6+.4*p});opacity:${clamp(p*1.4)};transform-origin:50% 100%;">${mascotSVG({pose:o.pose||'wave',mood:o.mood||'happy',size:o.size||420})}</div>`; };
function typed(str,lt,at,cps=28){ const n=Math.floor(Math.max(0,lt-at)*cps); return rich(str.slice(0,n))+(n<str.length&&lt>at?'<span style="opacity:.5">|</span>':''); }

// blurred black-and-white footage behind a text scene, when the beat has media
const backdrop=(b,lt)=>MEDIA[b.i]?mediaFill(b,lt,{blur:10})+`<div class="layer" style="background:rgba(233,226,214,.5)"></div>`:'';

// ---- clay props: soft 3D objects (gradients + soft shadow) that float into a scene: b.props = [{k, x, y, s, at}] ----
const INKS=`stroke="#1F1D1A" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"`;
const PROP={
 gift:`<rect x="-90" y="-40" width="180" height="140" rx="12" fill="#FFD23F" ${INKS}/><rect x="-104" y="-80" width="208" height="50" rx="10" fill="#FFD23F" ${INKS}/><rect x="-16" y="-80" width="32" height="180" fill="#F27059" ${INKS}/><path d="M0 -80 C-60 -150 -110 -90 -40 -80 M0 -80 C60 -150 110 -90 40 -80" fill="none" ${INKS}/>`,
 coins:`${[0,1,2,3].map(k=>`<ellipse cx="0" cy="${50-k*30}" rx="80" ry="26" fill="#FFD23F" ${INKS}/>`).join('')}<text x="0" y="-48" text-anchor="middle" font-family="Geist" font-weight="800" font-size="40" fill="#1F1D1A">₹</text>`,
 cash:`${[0,1,2].map(k=>`<rect x="${-110+k*8}" y="${-50-k*16}" width="220" height="110" rx="10" fill="#BFE3B4" ${INKS}/>`).join('')}<circle cx="16" cy="-27" r="26" fill="none" ${INKS}/><text x="16" y="-14" text-anchor="middle" font-family="Geist" font-weight="800" font-size="34" fill="#1F1D1A">₹</text>`,
 wallet:`<rect x="-110" y="-70" width="220" height="150" rx="22" fill="#B98560" ${INKS}/><rect x="30" y="-20" width="90" height="56" rx="14" fill="#8C5E3C" ${INKS}/><circle cx="62" cy="8" r="9" fill="#FFF"/>`,
 chart:`<rect x="-120" y="-100" width="240" height="200" rx="20" fill="#fff" ${INKS}/>${[0,1,2,3].map(k=>`<rect x="${-90+k*48}" y="${60-[40,70,105,150][k]}" width="34" height="${[40,70,105,150][k]}" rx="6" fill="${k==3?'#FFD23F':'#E6DED0'}" stroke="#1F1D1A" stroke-width="5"/>`).join('')}`,
 heart:`<path d="M0 50 C-110 -20 -70 -110 0 -50 C70 -110 110 -20 0 50Z" fill="#FF8A93" ${INKS}/>`,
 tick:`<circle r="80" fill="#8ED29A" ${INKS}/><path d="M-34 0 L-8 26 L38 -24" fill="none" stroke="#1F1D1A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`,
 cross:`<circle r="80" fill="#F27059" ${INKS}/><path d="M-30 -30 L30 30 M30 -30 L-30 30" stroke="#1F1D1A" stroke-width="16" stroke-linecap="round"/>`,
 megaphone:`<path d="M-80 -30 L40 -90 L40 90 L-80 30Z" fill="#FFD23F" ${INKS}/><rect x="-110" y="-34" width="40" height="68" rx="10" fill="#fff" ${INKS}/><path d="M70 -40 Q100 0 70 40" fill="none" ${INKS}/>`,
 tag:`<path d="M-100 -60 L60 -60 L110 0 L60 60 L-100 60Z" fill="#fff" ${INKS}/><circle cx="62" cy="0" r="12" fill="#fff" ${INKS}/>`,
 clock:`<circle r="90" fill="#fff" ${INKS}/><path d="M0 0 L0 -56 M0 0 L40 20" stroke="#1F1D1A" stroke-width="12" stroke-linecap="round"/>`
};
function props(b,lt){ return (b.props||[]).map((o,k)=>{ const at=o.at??(.3+k*.25), p=eb(P(lt,at,at+.45)), fl=Math.sin(lt*2+k)*10;
  return `<svg class="abs" style="left:${o.x-150}px;top:${o.y-150}px;overflow:visible" width="300" height="300" viewBox="-150 -150 300 300">
    <g transform="translate(0 ${(1-p)*140+fl}) scale(${(o.s||1)*p}) rotate(${(o.r||0)+(1-p)*-20})" opacity="${clamp(p*1.5)}">${PROP[o.k]||''}</g></svg>`; }).join(''); }
// ---------------- scenes ----------------
const SC={};
// full-bleed black-and-white photo/clip, optional floating card and Nib
SC.photo={ draw(b,lt){ const p=eb(P(lt,.35,.8));
  return mediaFill(b,lt)+`<div class="layer" style="background:linear-gradient(transparent 55%,rgba(233,226,214,.85) 82%)"></div>`
   +(b.card?`<div class="abs card" style="left:120px;right:120px;top:${b.cardTop||1120}px;padding:44px 50px;font:800 96px/1.05 Geist,Deva;letter-spacing:-.03em;transform:translateY(${(1-p)*80}px) rotate(-1.5deg);opacity:${clamp(p*1.5)}">${rich(b.card)}</div>`:'')
   +nib(b.nib,lt,.5); }, ev:b=>[[.35,'pop',.35]] };

// a desk monitor showing the photo/clip, camera pushes in, cursor wanders, Nib pops onto the screen
SC.monitor={ draw(b,lt){ const z=lerp(.86,1.08,eio(P(lt,0,b.dur))), cx=lerp(260,640,eio(P(lt,.4,1.6))), cy=lerp(560,760,eio(P(lt,.4,1.6)));
  return `<div class="layer" style="transform:scale(${z});transform-origin:540px 860px">
    <div class="abs" style="left:0;right:0;top:1180px;bottom:0;background:linear-gradient(#2B2925,#1E1C19)"></div>
    <div class="abs" style="left:470px;top:1090px;width:140px;height:110px;background:#26241F"></div>
    <div class="abs" style="left:60px;top:470px;width:960px;height:640px;border-radius:26px;background:#141311;padding:16px;box-shadow:0 40px 80px rgba(0,0,0,.35)">
      <div style="position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden">${mediaFill(b,lt,{zoom:1.02}).replace('width:1080px;height:1920px','width:928px;height:608px')}
        ${b.nib?`<div class="abs" style="left:${b.nib.x??330}px;top:${b.nib.y??120}px;transform:scale(${eb(P(lt,.9,1.3))});">${mascotSVG({pose:b.nib.pose||'wave',mood:b.nib.mood||'happy',size:b.nib.size||300})}</div>`:''}
        ${b.text?`<div class="abs" style="left:40px;top:40px;font:800 150px/1 Geist;letter-spacing:-.04em;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.55);transform:scale(${eb(P(lt,1.0,1.4))});transform-origin:0 0">${rich(b.text)}</div>`:''}
        <svg class="abs" style="left:${cx}px;top:${cy}px" width="44" height="44" viewBox="0 0 60 60"><path d="M8 4 L8 46 L19 36 L27 54 L35 50 L27 33 L42 33 Z" fill="#fff" stroke="#000" stroke-width="3"/></svg>
      </div></div></div>`; }, ev:b=>[[.9,'pop',.45],[1.6,'click',.35]] };

// a phone with a chat; the photo/clip blurred behind
SC.phone={ draw(b,lt){ const msgs=b.msgs||[], step=Math.max(.7,(b.dur-.6)/Math.max(1,msgs.length)), p=eo(P(lt,0,.5));
  let h=''; msgs.forEach((m,k)=>{ const a=.4+k*step, q=eb(P(lt,a,a+.3)); if(lt<a) return;
    const me=m.from==='me'; h+=`<div style="display:flex;justify-content:${me?'flex-end':'flex-start'};margin:16px 0;transform:scale(${q});transform-origin:${me?'100%':'0%'} 50%"><div style="max-width:80%;padding:22px 30px;border-radius:28px;font:600 52px/1.2 Geist,Deva;background:${me?'#DCF8C6':'#fff'};box-shadow:0 2px 6px rgba(0,0,0,.08)">${rich(m.text)}<div style="font:500 22px Geist;color:#8a8a8a;text-align:right;margin-top:6px">${m.time||''}</div></div></div>`; });
  return mediaFill(b,lt,{blur:14})+`<div class="layer" style="background:rgba(233,226,214,.35)"></div>
    <div class="abs" style="left:250px;top:${lerp(560,420,p)}px;width:580px;height:1060px;border-radius:70px;background:#121110;padding:18px;box-shadow:16px 18px 0 rgba(31,29,26,.18);transform:rotate(${lerp(6,-2,p)}deg)">
      <div style="width:100%;height:100%;border-radius:54px;background:#ECE5DD;overflow:hidden;padding:110px 26px 30px;position:relative">
        <div class="abs" style="left:50%;top:18px;width:150px;height:36px;margin-left:-75px;border-radius:20px;background:#121110"></div>
        <div class="abs" style="left:0;right:0;top:56px;text-align:center;font:600 28px Geist;color:#555">${esc(b.contact||'Creator')}</div>${h}</div></div>`; },
  ev(b){ const n=(b.msgs||[]).length, step=Math.max(.7,(b.dur-.6)/Math.max(1,n)); return [[0,'whoosh',.3],...[...Array(n)].map((_,k)=>[.4+k*step,'pop',.35])]; } };

// Nib (top) and a viewer (bottom) talking in bubbles
SC.chat={ draw(b,lt){ const L=b.lines||[], step=Math.max(.8,(b.dur-.5)/Math.max(1,L.length));
  let h=''; L.forEach((l,k)=>{ const a=.3+k*step; if(lt<a) return; const nibSide=l.who==='nib', q=eb(P(lt,a,a+.3));
    h+=`<div class="abs bub" style="left:50%;top:${nibSide?820:1130}px;transform:translateX(-50%) scale(${q});white-space:nowrap;opacity:${k===L.length-1||L[k+1]&&L[k+1].who!==l.who||lt<a+step?1:0}">${typed(l.text,lt,a,40)}</div>`; });
  return backdrop(b,lt)+`${nib(Object.assign({x:330,y:360,size:380,pose:'idle',mood:'smile'},b.nib||{}),lt,0)}
    <div class="abs" style="left:465px;top:1290px;width:150px;height:150px;border-radius:50%;background:#BDB5A8;border:4px solid #1F1D1A;overflow:hidden">
      <div style="position:absolute;left:47px;top:30px;width:56px;height:56px;border-radius:50%;background:#E8E8E8"></div><div style="position:absolute;left:25px;top:96px;width:100px;height:80px;border-radius:50%;background:#E8E8E8"></div></div>${h}`; },
  ev(b){ const L=b.lines||[], step=Math.max(.8,(b.dur-.5)/Math.max(1,L.length)); return L.map((_,k)=>[.3+k*step,'pop',.35]); } };

// big kinetic words: a small line + a big accent word (or a giant glyph like "?")
SC.word={ draw(b,lt){ const p=eb(P(lt,.1,.5)), g=b.glyph;
  return backdrop(b,lt)
   +(g?`<div class="abs" style="left:0;right:0;top:560px;text-align:center;font:800 640px/1 Geist;transform:rotate(${lerp(-25,0,p)}deg) scale(${.7+.3*p});filter:blur(${(1-p)*14}px)">${esc(g)}</div>`:'')
   +`<div class="abs" style="left:80px;right:80px;top:${g?1280:820}px;text-align:center">
      <div style="font:600 64px/1.1 Geist,Deva;opacity:${eo(P(lt,.15,.45))}">${typed(b.small||'',lt,.15,30)}</div>
      <div style="font:800 ${b.bigSize||170}px/1 Geist,Deva;letter-spacing:-.04em;margin-top:10px;color:var(--y2);transform:translateY(${(1-eb(P(lt,.45,.9)))*60}px);opacity:${eo(P(lt,.45,.7))};">${esc(b.big||'')}</div></div>`
   +nib(b.nib,lt,.6); }, ev:b=>[[.1,'whoosh',.3],[.45,'thump',.35]] };

// an extruded paper card typing itself (an email, a note, a DM), with a small bubble linked by a dashed line
SC.card={ draw(b,lt){ const p=eo(P(lt,0,.45)), lines=b.lines||[]; let body='', at=.5;
  lines.forEach(l=>{ body+=`<div style="margin-top:22px">${typed(l,lt,at,34)}</div>`; at+=Math.max(.5,l.length/34); });
  return backdrop(b,lt)+ `${b.note?`<div class="abs bub" style="left:110px;top:520px;transform:scale(${eb(P(lt,.2,.5))});transform-origin:0 50%">${rich(b.note)}</div>
      <div class="abs" style="left:200px;top:610px;height:${110*eo(P(lt,.4,.7))}px;border-left:6px dashed #2a2a2a"></div>`:''}
    <div class="abs card" style="left:120px;right:120px;top:${lerp(840,740,p)}px;padding:56px 54px;font:500 46px/1.3 Geist,Deva;transform:rotate(${lerp(4,-1,p)}deg)">
      <div style="font:800 ${lines.length?58:110}px/1.1 Geist,Deva;letter-spacing:-.03em;text-align:${lines.length?'left':'center'}">${rich(b.title||'')}</div>${body}</div>`+nib(b.nib===undefined?{x:560,y:1130,size:280,pose:'point',mood:'smile'}:b.nib,lt,.7); },
  ev:b=>[[0,'whoosh',.3],[.5,'scribble',.25]] };

// a big number counting up on a card, B&W photo blurred behind
SC.stat={ draw(b,lt){ const v=(b.value||0)*eo(P(lt,.3,Math.min(b.dur-.4,2.4))), p=eb(P(lt,.1,.5));
  return mediaFill(b,lt,{blur:16})+`<div class="layer" style="background:rgba(233,226,214,.5)"></div>
    <div class="abs card" style="left:110px;right:110px;top:700px;padding:70px 40px;text-align:center;transform:scale(${.85+.15*p}) rotate(-1deg)">
      <div style="font:800 190px/1 Geist;letter-spacing:-.05em">${esc(b.pre||'')}${fmt(v)}${esc(b.suf||'')}</div>
      <div style="font:600 46px/1.2 Geist,Deva;color:var(--mut);margin-top:18px">${rich(b.unit||'')}</div></div>`; },
  ev:b=>[[.3,'tick',.25],[.9,'tick',.25],[1.5,'tick',.25],[2.2,'ding',.35]] };

// an invented social post (generic handle, never a real account) over the blurred photo
SC.post={ draw(b,lt){ const p=eb(P(lt,.1,.55)), likes=(b.likes||0)*eo(P(lt,.8,2.4));
  return mediaFill(b,lt,{blur:12})+`<div class="layer" style="background:rgba(233,226,214,.4)"></div>
    <div class="abs card" style="left:90px;right:90px;top:620px;padding:40px;transform:translateY(${(1-p)*120}px) rotate(-1.2deg)">
      <div style="display:flex;align-items:center;gap:20px"><div style="width:84px;height:84px;border-radius:50%;background:#FFD23F;border:4px solid #1F1D1A"></div>
        <div><div style="font:700 36px Geist">${esc(b.name||'A creator')}</div><div style="font:500 28px Geist;color:#8D857A">${esc(b.handle||'@creator')}</div></div></div>
      <div style="font:500 44px/1.3 Geist,Deva;margin-top:28px">${typed(b.text||'',lt,.5,40)}</div>
      <div style="display:flex;gap:40px;margin-top:30px;font:600 34px Geist;color:#6E675D"><span>♥ ${fmt(likes)}</span><span>↻ ${fmt(likes/9)}</span></div></div>`; },
  ev:b=>[[.1,'whoosh',.3],[.8,'tick',.2],[1.4,'tick',.2],[2.0,'ding',.3]] };

// big icon tiles with one word each (the method, without sentences): items [{g:"✓"|"#"|"₹"|any 1-3 chars, w:"one word"}]
SC.icons={ draw(b,lt){ const it=b.items||[], n=it.length, span=Math.max(1.2,b.dur-.8); let h='';
  it.forEach((o,k)=>{ const a=.25+k*span/n, q=eb(P(lt,a,a+.4)), y=600+k*300;
    h+=`<div class="abs card" style="left:170px;right:170px;top:${y}px;height:240px;display:flex;align-items:center;gap:40px;padding:0 46px;transform:scale(${q}) rotate(${k%2?1.2:-1.2}deg);opacity:${clamp(q*1.4)}">
      <div style="width:150px;height:150px;border-radius:40px;display:grid;place-items:center;font:800 96px/1 Geist,Deva;background:#FFD23F;border:4px solid #1F1D1A">${esc(o.g)}</div>
      <div style="font:800 72px/1 Geist,Deva;letter-spacing:-.03em">${esc(o.w||'')}</div></div>`; });
  return backdrop(b,lt)+ h; },
  ev(b){ const n=(b.items||[]).length, span=Math.max(1.2,b.dur-.8); return [...Array(n)].map((_,k)=>[.25+k*span/n,'pop',.45]); } };

// OPENING "everyone's talking about it" montage: a close-up of one post with the keyword highlighted, then the camera
// pulls back into a wall of floating posts / headlines (cards: [{name, handle, text, kw}]). Real screenshots go in `media`.
SC.collage={ draw(b,lt){ const C=b.cards||[], z=lerp(2.8,1.12,eio(P(lt,.5,1.9))), fx=lerp(-260,0,eio(P(lt,.5,1.9)));
  const pos=[[70,470,-3],[560,420,2],[60,880,2],[580,820,-2],[300,1200,-1],[620,1260,3],[40,1300,1]];
  let h=''; C.forEach((c,k)=>{ const [x,y,r]=pos[k%pos.length], a=k?.6+k*.12:0, q=k?eo(P(lt,a,a+.3)):1;
    const t=esc(c.text||'').replace(new RegExp('('+(c.kw||'@@@').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i'),'<span style="background:#FFD23F;padding:0 6px">$1</span>');
    h+=`<div class="abs card" style="left:${x}px;top:${y}px;width:${k?440:470}px;padding:26px 28px;transform:rotate(${r}deg) scale(${q});opacity:${q};font:600 36px/1.25 Geist,Deva">
      <div style="display:flex;gap:14px;align-items:center;margin-bottom:12px"><div style="width:52px;height:52px;border-radius:50%;background:${['#FFD23F','#9BC3E8','#F4A3A3','#BFE3B4'][k%4]};border:3px solid #1F1D1A"></div>
      <div><div style="font:700 28px Geist">${esc(c.name||'Creator')}</div><div style="font:500 22px Geist;color:#8D857A">${esc(c.handle||'@creator')}</div></div></div>${t}</div>`; });
  return backdrop(b,lt)+`<div class="layer" style="transform:translate(${fx}px,0) scale(${z});transform-origin:300px 640px">${h}</div>`; },
  ev(b){ return [[0,'whoosh',.35],...(b.cards||[]).slice(1).map((_,k)=>[.6+(k+1)*.12,'pop',.22])]; } };

// one object in the middle that FLIPS (spins on its vertical axis) into a second object, then 2 kinetic words land
// a / b: {k: prop name} or {nib:true} or {g: "text/emoji"}; words: {small, big}
SC.reveal={ draw(b,lt){ const spin=P(lt,b.flipAt??1.0,(b.flipAt??1.0)+.45), side=spin<.5?b.a:b.b, sx=Math.abs(Math.cos(spin*Math.PI)), p=eb(P(lt,0,.4));
  const obj=o=>!o?'':o.nib?mascotSVG({pose:o.pose||'wave',mood:o.mood||'happy',size:420})
    :o.k?`<svg width="560" height="560" viewBox="-150 -150 300 300" style="overflow:visible">${PROP[o.k]||''}</svg>`
    :`<div style="width:360px;height:360px;border-radius:50%;background:#FFD23F;border:6px solid #1F1D1A;display:grid;place-items:center;font:800 150px Geist,Deva">${esc(o.g||'?')}</div>`;
  const w=b.words||{};
  return backdrop(b,lt)+`<div class="abs" style="left:0;right:0;top:${lt>(b.flipAt??1)+.5&&(w.big||w.small)?560:700}px;display:flex;justify-content:center;transform:scaleX(${Math.max(.04,sx)}) scale(${.7+.3*p})">${obj(side)}</div>
    ${(w.small||w.big)?`<div class="abs" style="left:60px;right:60px;top:1130px;text-align:center;opacity:${eo(P(lt,(b.flipAt??1)+.5,(b.flipAt??1)+.8))}">
      <div style="font:600 64px/1.1 Geist,Deva">${esc(w.small||'')}</div><div style="font:800 140px/1 Geist,Deva;letter-spacing:-.04em;color:var(--y2)">${esc(w.big||'')}</div></div>`:''}`; },
  ev:b=>[[.0,'pop',.4],[b.flipAt??1,'whoosh',.4],[(b.flipAt??1)+.5,'thump',.35]] };

// reaction beat: a giant "?" (or "!") swinging in, Nib peeking from the edge looking confused
SC.react={ draw(b,lt){ const p=eb(P(lt,0,.5)), peek=eo(P(lt,.4,.9));
  return `<div class="abs" style="left:0;right:0;top:420px;text-align:center;font:800 900px/1 Geist;transform:rotate(${lerp(-30,6,p)+Math.sin(lt*3)*3}deg) scale(${.6+.4*p});filter:blur(${(1-p)*16}px)">${esc(b.glyph||'?')}</div>
    <div class="abs" style="left:${lerp(1180,700,peek)}px;top:1150px;transform:rotate(-14deg)">${mascotSVG({pose:'shrug',mood:'worried',size:320})}</div>`; },
  ev:b=>[[0,'whoosh',.4],[.4,'pop',.3]] };

// a dashed flow line: the camera glides from node to node (prop, bubble, document...). nodes: [{k|text|doc, label}]
SC.flow={ draw(b,lt){ const N=b.nodes||[], gap=760, n=N.length, cam=lerp(0,(n-1)*gap,eio(P(lt,.3,Math.max(.8,b.dur-.6))));
  let h=`<div class="abs" style="left:540px;top:1000px;width:${(n-1)*gap}px;border-top:7px dashed #1F1D1A"></div>`;
  N.forEach((o,k)=>{ const x=540+k*gap, near=1-clamp(Math.abs(cam-k*gap)/gap), q=eb(P(near,.2,.8));
    const body=o.k?`<svg width="340" height="340" viewBox="-150 -150 300 300" style="overflow:visible">${PROP[o.k]||''}</svg>`
      :o.doc?`<div class="card" style="width:520px;padding:40px;font:600 42px/1.35 Geist,Deva;text-align:left">${o.doc.map(l=>`<div>${rich(l)}</div>`).join('')}</div>`
      :`<div class="bub" style="width:max-content;max-width:600px">${rich(o.text||'')}</div>`;
    h+=`<div class="abs" style="left:${x}px;top:1000px;transform:translate(-50%,-50%) scale(${.75+.25*q})">${body}
      ${o.label?`<div style="text-align:center;margin-top:18px;font:800 72px/1 Geist,Deva;color:var(--y2);opacity:${q}">${esc(o.label)}</div>`:''}</div>`; });
  return backdrop(b,lt)+`<div class="abs" style="left:0;top:0;width:1080px;height:1920px;overflow:visible;transform:translateX(${-cam}px)">${h}</div>`; },
  ev(b){ const n=(b.nodes||[]).length; return [...Array(n)].map((_,k)=>[.3+k*Math.max(.8,b.dur-.9)/Math.max(1,n-1),'whoosh',.3]); } };

// closing: Nib + Follow button, then the send ask
SC.cta={ draw(b,lt){ const on=lt>1.1, press=P(lt,.95,1.1);
  return `${nib({x:330,y:520,size:420,pose:on?'cheer':'point',mood:'happy'},lt,0)}
    <div class="abs" style="left:290px;top:1180px;width:500px;height:130px;border-radius:65px;display:grid;place-items:center;font:700 56px Geist;
      background:${on?'#fff':'#1F1D1A'};color:${on?'#1F1D1A':'#fff'};border:4px solid #1F1D1A;box-shadow:8px 10px 0 rgba(31,29,26,.14);transform:scale(${1-.08*Math.sin(press*Math.PI)})">${on?'Following':'Follow'}</div>
    <div class="abs" style="left:80px;right:80px;top:1360px;text-align:center;font:800 76px/1.15 Geist,Deva;letter-spacing:-.03em;opacity:${eo(P(lt,1.4,1.8))}">${rich(b.text||'**Send** this to a creator friend')}</div>`; },
  ev:b=>[[.95,'click',.6],[1.1,'ding',.3]] };

// ---------------- timeline ----------------
window.setTimeline=(tl,post)=>{ T=tl; POST=post; MEDIA=post._media||{};
  SCN=T.beats.map((b,i)=>({...b,i}));
  const ev=[]; SCN.forEach(b=>{ if(b.i>0) ev.push([b.start,'whoosh',.35]);
    (SC[b.scene]&&SC[b.scene].ev?SC[b.scene].ev(b):[]).forEach(([t,s,g])=>{ if(t<b.dur) ev.push([b.start+t,s,g]); }); });
  window.EV=ev.sort((a,b)=>a[0]-b[0]);
  if(post.captions===false) $('cap').style.display='none';
};
function idx(t){ let i=SCN.findIndex(b=>t<b.start+b.dur); return i<0?SCN.length-1:i; }
const sceneHTML=(b,lt)=>(SC[b.scene]||SC.word).draw(b,lt)+props(b,lt);
window.render=function(t){
  const i=idx(t), b=SCN[i], lt=t-b.start, W=.34, dir=i%2?1:-1;
  const inT=i>0&&lt<W, k=inT?eio(lt/W):1;
  if(inT){ const pb=SCN[i-1], A=$('A'); A.innerHTML=sceneHTML(pb,t-pb.start); A.style.display='block';
    A.style.transform=`translateX(${-dir*1080*k}px)`; A.style.filter=`blur(${Math.sin(k*Math.PI)*18}px)`; }
  else $('A').style.display='none';
  const B=$('B'); B.innerHTML=sceneHTML(b,lt);
  B.style.transform=`translateX(${dir*1080*(1-k)}px)`; B.style.filter=inT?`blur(${Math.sin(k*Math.PI)*18}px)`:'none';
  $('gt').setAttribute('seed', Math.floor(t*12)%9+1);
  const cap=$('cap'); if(POST.captions!==false){ if(cap.dataset.k!==String(i)){cap.dataset.k=i; cap.innerHTML=(b.hi||b.say).split(' ').map(w=>`<span>${esc(w)} </span>`).join('');}
    const ws=cap.querySelectorAll('span'), sp=P(t,b.start,b.start+(b.speech||b.dur)*.95); ws.forEach((w,j)=>{w.style.color=j/ws.length<=sp?'#1F1D1A':'#B3AA9C';}); }
  return Promise.all([...document.images].map(im=>im.complete?im.decode().catch(()=>0):new Promise(r=>{im.onload=im.onerror=r})));
};
</script></body></html>
