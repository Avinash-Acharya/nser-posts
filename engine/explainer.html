<!doctype html>
<html><head><meta charset="utf-8">
<!-- Explainer reel: one illustrated scene per spoken line (a visual metaphor that SHOWS the line),
     iris cuts between scenes, slow camera push, hand-drawn "boiling" ink on twos, big keyword label,
     small word-by-word captions. Pure function of time: window.render(t). window.EV lists sound cues. -->
<style>
  @font-face{font-family:"Fraunces";src:url(fonts/Fraunces.ttf)}
  @font-face{font-family:"Caveat";src:url(fonts/Caveat.ttf)}
  @font-face{font-family:"Deva";src:url(fonts/NotoSansDevanagari.ttf)}
  :root{--ink:#1C1A17;--paper:#FAF3E6;--mark:#FFE16A;--mut:#6B665D}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:var(--paper);overflow:hidden}
  body{font-family:"Inter","Deva",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .abs{position:absolute}
  .layer{position:absolute;inset:0;overflow:hidden}
  .serif{font-family:"Fraunces","Deva";font-weight:600;letter-spacing:-.025em;font-variation-settings:"opsz" 144,"SOFT" 50}
  .hand{font-family:"Caveat","Deva";font-weight:700}
  .lbl{position:absolute;left:80px;right:80px;top:300px;font-size:132px;line-height:.98}
  .lbl .w{display:inline-block;margin-right:.2em;background-image:linear-gradient(var(--mark),var(--mark));background-repeat:no-repeat;background-position:0 88%;background-size:0% 30%}
  #wm{left:80px;top:220px;font:600 32px/1 Inter;color:var(--mut);z-index:30}
  #cap{left:80px;right:80px;top:1470px;font:600 46px/1.28 "Inter","Deva";z-index:30}
  #cap span{color:#B9B1A3}
</style>
<script src="mascot.js"></script></head>
<body>
<div id="A" class="layer"></div>
<div id="B" class="layer"></div>
<div id="wm" class="abs">@nser.in_officials</div>
<div id="cap" class="abs"></div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="boil0" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
    <filter id="boil1" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
    <filter id="boil2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="29"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
  </defs>
</svg>
<script>
// ---------------- helpers ----------------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-clamp(x),3), ei=x=>Math.pow(clamp(x),3), eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eb=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const big=n=>n>=1e9?(n/1e9).toFixed(n%1e9?1:0)+'B':n>=1e6?(n/1e6).toFixed(n%1e6&&n<1e8?1:0)+'M':n>=1e4?Math.round(n/1e3)+'K':fmt(n);
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const $=id=>document.getElementById(id);
const INK='#1C1A17', Y='#FFD23F', Y2='#F2B705', CORAL='#F27059', TEAL='#2A9D8F', BLUE='#4D7CC7', CREAM='#FFF9EC', PINK='#FF9DA6';
const PLANES=['#F9E3CF','#DCEEDF','#DDE9F3','#FBEFC6','#E9E1F2','#F6DCD7'];
let T=null, POST=null, SCN=[];

// pop-in: scale with overshoot, starting at `at` seconds into the scene
const pop=(lt,at,d=.35)=>eb(P(lt,at,at+d));
const fade=(lt,at,d=.25)=>eo(P(lt,at,at+d));
// group with transform helper
const G=(x,y,s,inner,extra='')=>`<g transform="translate(${x} ${y}) scale(${s})" ${extra}>${inner}</g>`;
const ST=`stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"`;

// ---------------- props (drawn in Nib's ink style) ----------------
// a person: bean head, simple body. pose: stand | walk | sit | cheer | sad. phase drives walking.
function person(x,y,s,o={}){
  const c=o.color||BLUE, skin=o.skin||'#E8B48A', hair=o.hair||INK, ph=o.phase||0, pose=o.pose||'stand', face=o.face||'smile';
  const sw=pose==='walk'?Math.sin(ph)*26:0, bob=pose==='walk'?Math.abs(Math.sin(ph))*-6:0;
  const arms = pose==='cheer'?`<path d="M-30 -60 L-62 -118" ${ST}/><path d="M30 -60 L62 -118" ${ST}/>`
             : pose==='sad'?`<path d="M-30 -58 L-40 0" ${ST}/><path d="M30 -58 L40 0" ${ST}/>`
             : pose==='hold'?`<path d="M-30 -58 L-10 -30" ${ST}/><path d="M30 -58 L10 -30" ${ST}/>`
             : `<path d="M-30 -58 L${-44-sw*.6} -6" ${ST}/><path d="M30 -58 L${44+sw*.6} -6" ${ST}/>`;
  const legs = pose==='sit'?`<path d="M-14 0 L-14 20 L30 20 L30 64" ${ST}/><path d="M14 0 L14 20 L56 20 L56 64" ${ST}/>`
             : `<path d="M-14 0 L${-14-sw} 70" ${ST}/><path d="M14 0 L${14+sw} 70" ${ST}/>`;
  const eyes = face==='sad'?`<path d="M-17 -128 q5 4 10 0 M7 -128 q5 4 10 0" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`
             : `<ellipse cx="-12" cy="-128" rx="4.5" ry="6.5" fill="${INK}"/><ellipse cx="12" cy="-128" rx="4.5" ry="6.5" fill="${INK}"/>`;
  const mouth = face==='sad'?`<path d="M-9 -106 q9 -8 18 0" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`
              : face==='wow'?`<ellipse cx="0" cy="-106" rx="6" ry="8" fill="${INK}"/>`
              : `<path d="M-10 -110 q10 10 20 0" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  return G(x,y+bob,s,`${legs}
    <path d="M-34 -70 Q-36 -2 -26 4 L26 4 Q36 -2 34 -70 Q0 -84 -34 -70Z" fill="${c}" ${ST}/>
    ${arms}
    <ellipse cx="0" cy="-124" rx="38" ry="44" fill="${skin}" ${ST}/>
    <path d="M-38 -132 Q-34 -176 2 -170 Q38 -168 38 -130 Q20 -150 -38 -132Z" fill="${hair}"/>
    ${eyes}${mouth}
    <ellipse cx="-24" cy="-112" rx="7" ry="4" fill="${PINK}" opacity=".8"/><ellipse cx="24" cy="-112" rx="7" ry="4" fill="${PINK}" opacity=".8"/>`);
}
function phoneProp(x,y,w,h,inner='',rot=0){
  return `<g transform="translate(${x} ${y}) rotate(${rot})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${w*.14}" fill="${INK}"/>
    <rect x="${-w/2+12}" y="${-h/2+12}" width="${w-24}" height="${h-24}" rx="${w*.1}" fill="#fff"/>
    <rect x="-24" y="${-h/2+20}" width="48" height="12" rx="6" fill="${INK}"/>${inner}</g>`;
}
const playBtn=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${CORAL}" ${ST}/><path d="M${x-r*.3} ${y-r*.42} L${x+r*.48} ${y} L${x-r*.3} ${y+r*.42}Z" fill="#fff"/>`;
const eye=(x,y)=>`<path d="M${x-22} ${y} Q${x} ${y-18} ${x+22} ${y} Q${x} ${y+18} ${x-22} ${y}Z" fill="#fff" stroke="${INK}" stroke-width="4"/><circle cx="${x}" cy="${y}" r="7" fill="${INK}"/>`;
const sparkle=(x,y,s,o=1)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 -20 Q3 -3 20 0 Q3 3 0 20 Q-3 3 -20 0 Q-3 -3 0 -20Z" fill="${INK}" opacity="${o}"/>`;
const txt=(x,y,s,str,o={})=>`<text x="${x}" y="${y}" font-family="${o.f||'Inter'}" font-weight="${o.w||700}" font-size="${s}" fill="${o.c||INK}" text-anchor="${o.a||'middle'}" ${o.extra||''}>${esc(str)}</text>`;
function thumbCard(x,y,w,h,k,o={}){ // a generic video thumbnail (invented shapes, never a real one)
  const cols=[[CORAL,Y],[TEAL,'#FFE3B0'],[BLUE,PINK],[Y,TEAL],['#9B7BD1',Y],[CORAL,BLUE]][k%6];
  return `<g transform="translate(${x} ${y})"><rect x="0" y="0" width="${w}" height="${h}" rx="18" fill="${cols[0]}" ${ST}/>
    <circle cx="${w*.32}" cy="${h*.55}" r="${h*.26}" fill="${cols[1]}" stroke="${INK}" stroke-width="5"/>
    <rect x="${w*.58}" y="${h*.28}" width="${w*.3}" height="${h*.12}" rx="6" fill="#fff"/><rect x="${w*.58}" y="${h*.5}" width="${w*.22}" height="${h*.12}" rx="6" fill="#fff"/>
    ${o.badge?`<rect x="${w-96}" y="${h-46}" width="84" height="36" rx="10" fill="${INK}"/>${txt(w-54,h-19,26,o.badge,{c:'#fff'})}`:''}</g>`;
}

// ---------------- scenes ----------------
// each scene: draw(b, lt) -> {svg, html}; ev(b) -> [[t, sound, gain]] relative to scene start
const SC = {};
const ZOOM={city:1,village:1,bubbles:1,versus:1,calendar:1.25,counter:1.15,desk:1.3,jar:1.15,door:1.25,clock:1.2,send:1.3,question:1.1};

// many small creators; most walk away, one stays (yellow)
SC.walkaway = {
  draw(b,lt){ const n=5, stay=b.stay??2; let s='';
    s+=`<rect x="40" y="1330" width="1000" height="16" rx="8" fill="${INK}" opacity=".12"/>`;
    for(let i=0;i<n;i++){ const x0=170+i*185, leave=i!==stay, at=.5+((i*3)%n)*.3;
      const k=leave?eio(P(lt,at,at+1.6)):0, x=x0+k*820, phase=lt*9+i;
      const views=`<g transform="translate(${x0} 850)" opacity="${1-k}">${eye(-22,0)}${txt(22,14,44,'0',{a:'start'})}</g>`;
      s+=views+person(x,1320,1.5,{color:i===stay?Y:[BLUE,TEAL,CORAL,'#9B7BD1'][i%4],pose:leave&&k>0&&k<1?'walk':'stand',phase,face:leave&&k>0?'sad':'smile'});
    }
    return {svg:s};
  },
  ev:b=>[[.5,'step',.25],[1.1,'step',.25],[1.6,'step',.25],[2.2,'step',.25]]
};

// calendar flips from year a to year b; an upload arrow pops each flip
SC.calendar = {
  draw(b,lt){ const a=b.from||2012, z=b.to||2017, n=z-a, per=(Math.min(b.dur,6)-1)/Math.max(1,n);
    const i=Math.min(n,Math.floor(P(lt,.5,.5+per*n)*n+1e-6)), yr=a+i, flip=P((lt-.5)%per,0,.25);
    let s=`<g transform="translate(540 1000)">
      <rect x="-250" y="-260" width="500" height="520" rx="34" fill="#fff" ${ST}/>
      <rect x="-250" y="-260" width="500" height="120" rx="34" fill="${CORAL}" ${ST}/>
      <circle cx="-140" cy="-262" r="16" fill="${INK}"/><circle cx="140" cy="-262" r="16" fill="${INK}"/>
      ${txt(0,90,170,yr,{f:'Fraunces',w:600})}
      ${lt>.5&&i<n?`<path d="M-250 -140 L250 -140 L250 ${-140+380*(1-flip)} L-250 ${-140+380*(1-flip)}Z" fill="#F3EDE0" opacity="${1-flip}"/>`:''}
    </g>`;
    for(let k=0;k<=i;k++){ const p=pop(lt,.5+k*per,.3), x=200+k*(680/Math.max(1,n));
      s+=`<g transform="translate(${x} 1300) scale(${p})"><circle r="38" fill="${Y}" ${ST}/><path d="M0 16 L0 -16 M-14 -2 L0 -16 L14 -2" ${ST} fill="none"/></g>`; }
    return {svg:s};
  },
  ev(b){ const n=(b.to||2017)-(b.from||2012), per=(Math.min(b.dur,6)-1)/Math.max(1,n); return [...Array(n+1)].map((_,k)=>[.5+k*per,'click',.35]); }
};

// a big number rolls up, with a rising line behind
SC.counter = {
  draw(b,lt){ const v=(b.value||1e6)*eo(P(lt,.3,Math.min(b.dur-.6,3)));
    const pts=[...Array(30)].map((_,k)=>{const x=140+k*28, f=k/29; return `${x},${1300-Math.pow(f,4)*420*eo(P(lt,.3,2.5))}`}).join(' ');
    return {svg:`<polyline points="${pts}" fill="none" stroke="${Y2}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
      ${txt(540,1080,190,big(v),{f:'Fraunces',w:600})}
      ${txt(540,1170,58,b.unit||'subscribers',{f:'Caveat',w:700,c:'#6B665D'})}
      ${sparkle(240,860,1.6,fade(lt,1.6))}${sparkle(860,820,1.2,fade(lt,1.9))}`};
  },
  ev:b=>[[.3,'tick',.25],[.9,'tick',.25],[1.5,'tick',.25],[2.1,'ding',.35]]
};

// Nib thinking with a big question mark: the open loop
SC.question = {
  draw(b,lt){ const q=pop(lt,.4,.45);
    return {svg:`<g transform="translate(700 980) scale(${q}) rotate(${Math.sin(lt*2)*4})">${txt(0,120,420,'?',{f:'Fraunces',w:600})}</g>`,
      html:`<div class="abs" style="left:60px;top:760px">${mascotSVG({pose:'think',mood:'worried',size:540})}</div>`};
  },
  ev:b=>[[.4,'pop',.5]]
};

// a kid at a desk with a laptop; tiny view counter
SC.desk = {
  draw(b,lt){ const up=pop(lt,.8), vw=Math.floor(eo(P(lt,1.2,2.6))*(b.views||12));
    return {svg:`<rect x="160" y="1150" width="760" height="26" rx="10" fill="#B9835A" ${ST}/>
      <path d="M220 1176 L220 1360 M860 1176 L860 1360" ${ST}/>
      <g transform="translate(640 1150)"><rect x="-170" y="-220" width="340" height="220" rx="18" fill="${INK}"/><rect x="-154" y="-204" width="308" height="188" rx="10" fill="#E9F1FA"/>
        ${playBtn(0,-110,44)}<path d="M-200 0 L200 0" stroke="${INK}" stroke-width="12" stroke-linecap="round"/></g>
      ${person(330,1300,1.05,{color:TEAL,pose:'sit'})}
      <g transform="translate(860 820) scale(${up})"><circle r="46" fill="${Y}" ${ST}/><path d="M0 20 L0 -20 M-17 -3 L0 -20 L17 -3" ${ST} fill="none"/></g>
      <g transform="translate(560 860)" opacity="${fade(lt,1.2)}">${eye(-70,-12)}${txt(-30,0,48,vw+' views',{a:'start'})}</g>`};
  },
  ev:b=>[[.8,'pop',.4],[1.3,'tick',.2],[1.8,'tick',.2]]
};

// a big jar that fills only a little: "good, not life-changing"
SC.jar = {
  draw(b,lt){ const f=(b.fill??.18)*eo(P(lt,.4,2.2)), H=520, top=820;
    let coins=''; const nC=Math.floor(f*40);
    for(let k=0;k<nC;k++){const cx=380+((k*73)%320), cy=top+H-20-Math.floor(k/6)*22; coins+=`<ellipse cx="${cx}" cy="${cy}" rx="26" ry="10" fill="${Y}" stroke="${INK}" stroke-width="4"/>`;}
    return {svg:`<path d="M330 ${top} L330 ${top+H} Q330 ${top+H+30} 360 ${top+H+30} L720 ${top+H+30} Q750 ${top+H+30} 750 ${top+H} L750 ${top}" fill="#F3FAFF" ${ST}/>
      <rect x="310" y="${top-40}" width="460" height="46" rx="16" fill="${CORAL}" ${ST}/>${coins}
      <path d="M790 ${top+20} L850 ${top+20}" stroke="${INK}" stroke-width="5" stroke-dasharray="10 12" opacity=".5"/>${txt(860,top+34,40,'goal',{a:'start',f:'Caveat',c:'#6B665D'})}`};
  },
  ev:b=>[...Array(6)].map((_,k)=>[.5+k*.28,'clink',.22])
};

// an exit door; footprints walking out
SC.door = {
  draw(b,lt){ const o=eio(P(lt,.4,1.2));
    let feet=''; for(let k=0;k<6;k++){const a=.6+k*.22; feet+=`<ellipse cx="${260+k*70}" cy="${1300-(k%2)*36}" rx="16" ry="26" fill="${INK}" opacity="${fade(lt,a)*.8}" transform="rotate(80 ${260+k*70} ${1300-(k%2)*36})"/>`;}
    return {svg:`<rect x="640" y="820" width="280" height="500" rx="10" fill="#2B2A28" ${ST}/>
      <path d="M640 820 L${640+280*(1-o*.75)} ${820+30*o} L${640+280*(1-o*.75)} ${1320-30*o} L640 1320Z" fill="#C98B5A" ${ST}/>
      <rect x="690" y="740" width="180" height="60" rx="12" fill="${TEAL}" ${ST}/>${txt(780,784,40,'EXIT',{c:'#fff'})}${feet}`};
  },
  ev:b=>[[.4,'creak',.4],...[...Array(6)].map((_,k)=>[.6+k*.22,'step',.2])]
};

// magnifier sweeping a grid of thumbnails, circling the winners
SC.magnify = {
  draw(b,lt){ let s=''; const hits=[1,5,6];
    for(let k=0;k<9;k++){const x=150+(k%3)*270, y=760+Math.floor(k/3)*200; s+=G(0,0,1,thumbCard(x,y,240,160,k));
      if(hits.includes(k)){const a=1.2+hits.indexOf(k)*.5, p=P(lt,a,a+.35); s+=`<ellipse cx="${x+120}" cy="${y+80}" rx="150" ry="104" fill="none" stroke="${CORAL}" stroke-width="9" stroke-dasharray="820" stroke-dashoffset="${820*(1-p)}" transform="rotate(-6 ${x+120} ${y+80})"/>`;}}
    const sw=P(lt,.2,b.dur-.3), mx=300+Math.sin(sw*Math.PI*2)*260+200*sw, my=880+Math.cos(sw*Math.PI*3)*160;
    s+=`<g transform="translate(${mx} ${my}) rotate(-20)"><circle r="105" fill="#fff" fill-opacity=".35" stroke="${INK}" stroke-width="12"/><path d="M75 75 L160 160" stroke="${INK}" stroke-width="26" stroke-linecap="round"/></g>`;
    return {svg:s};
  },
  ev:b=>[[1.2,'scribble',.35],[1.7,'scribble',.35],[2.2,'scribble',.35]]
};

// a notebook of study notes around one thumbnail
SC.notebook = {
  draw(b,lt){ const notes=b.notes||['the hook?','length','title'];
    let s=`<rect x="130" y="760" width="820" height="620" rx="24" fill="#FFFDF7" ${ST}/>`;
    for(let k=0;k<9;k++) s+=`<path d="M170 ${830+k*62} L910 ${830+k*62}" stroke="#BFD4EA" stroke-width="3"/>`;
    s+=G(0,0,1,thumbCard(330,880,420,260,2));
    const spots=[[330,900,250,836],[750,1010,880,1230],[540,1140,330,1290]];
    notes.forEach((n,k)=>{const a=.6+k*.7, p=P(lt,a,a+.4), [x1,y1,x2,y2]=spots[k%3];
      s+=`<path d="M${x1} ${y1} L${lerp(x1,x2,p)} ${lerp(y1,y2,p)}" stroke="${CORAL}" stroke-width="7" stroke-linecap="round"/>`;
      s+=`<g opacity="${fade(lt,a+.3)}">${txt(x2,y2+(y2>y1?44:-14),58,n,{f:'Caveat',c:CORAL})}</g>`;});
    return {svg:s};
  },
  ev:b=>[[.6,'scribble',.35],[1.3,'scribble',.35],[2.0,'scribble',.35]]
};

// a clock spinning through hours + a counter climbing
SC.clock = {
  draw(b,lt){ const p=eio(P(lt,.3,b.dur-.4)), hrs=(b.hours||40)*p, cnt=(b.value||100000)*p;
    let ticks=''; for(let k=0;k<12;k++) ticks+=`<path d="M0 -150 L0 -128" ${ST} transform="rotate(${k*30})"/>`;
    return {svg:`<g transform="translate(540 980)"><circle r="190" fill="#fff" ${ST} stroke-width="10"/>${ticks}
      <path d="M0 0 L0 -130" stroke="${INK}" stroke-width="12" stroke-linecap="round" transform="rotate(${hrs*360})"/>
      <path d="M0 0 L0 -86" stroke="${CORAL}" stroke-width="14" stroke-linecap="round" transform="rotate(${hrs*30})"/><circle r="14" fill="${INK}"/></g>
      ${txt(540,1300,110,fmt(cnt),{f:'Fraunces',w:600})}${txt(540,1370,52,'counted out loud',{f:'Caveat',c:'#6B665D'})}`};
  },
  ev:b=>[...Array(10)].map((_,k)=>[.4+k*(b.dur-.8)/10,'tick',.18])
};

// a flat line that suddenly shoots up, confetti
SC.rocket = {
  draw(b,lt){ const p=P(lt,.2,1.0), q=eo(P(lt,1.0,1.8)); let pts=[];
    for(let k=0;k<=40;k++){const f=k/40, x=140+f*800; let y=1300-f*40*p; if(f>.7) y-=Math.pow((f-.7)/.3,2.2)*560*q; if(f<=p||f<=.7) pts.push(`${x},${y}`); else if(q>0) pts.push(`${x},${y}`);}
    let conf=''; if(lt>1.5) for(let k=0;k<26;k++){const a=1.5, tt=lt-a, x=900+(hash(k)-.5)*500*tt, y=760+(hash(k+50)*-500+tt*600)*tt*.7; conf+=`<rect x="${x}" y="${y}" width="18" height="10" fill="${[CORAL,Y,TEAL,BLUE][k%4]}" transform="rotate(${k*40+tt*300} ${x} ${y})" opacity="${1-P(tt,1.2,2)}"/>`;}
    return {svg:`<path d="M140 1330 L940 1330 M140 1330 L140 740" stroke="${INK}" stroke-width="6" stroke-linecap="round" opacity=".35"/>
      <polyline points="${pts.join(' ')}" fill="none" stroke="${CORAL}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>${conf}`};
  },
  ev:b=>[[1.0,'whoosh_up',.5],[1.5,'ding',.4]]
};

// split frame: wrong way vs right way
SC.split = {
  draw(b,lt){ const w=eio(P(lt,.2,.6)), L=b.left||'Post & hope', R=b.right||'Study, test, post';
    const loop=lt*2.2; let arrows='';
    for(let k=0;k<3;k++){const a=loop+k*2.094; arrows+=`<circle cx="${780+Math.cos(a)*120}" cy="${1070+Math.sin(a)*120}" r="16" fill="${INK}"/>`;}

window.setTimeline=(tl,post)=>{ T=tl; POST=post;
  SCN=T.beats.map((b,i)=>({...b, i, plane:b.plane||PLANES[i%PLANES.length]}));
  const ev=[]; SCN.forEach(b=>{ if(b.i>0) ev.push([b.start,'whoosh',.3]); if(b.label) ev.push([b.start+.25,'pop',.25]);
    (SC[b.scene]&&SC[b.scene].ev?SC[b.scene].ev(b):[]).forEach(([t,s,g])=>{ if(t<b.dur) ev.push([b.start+t,s,g]); }); });
  window.EV=ev.sort((a,b)=>a[0]-b[0]);
  const pre=document.createElement('div'); pre.style.cssText='position:absolute;left:-9999px';
  pre.innerHTML=SCN.filter(b=>b.scene==='photo').map(b=>`<img src="${(post._dir||'')+b.src}">`).join(''); document.body.appendChild(pre);
};
function idx(t){ let i=SCN.findIndex(b=>t<b.start+b.dur); return i<0?SCN.length-1:i; }

function labelHTML(b,lt){ if(!b.label) return '';
  const ws=b.label.split(' ').map((w,k)=>{const m=/\*\*/.test(w), p=eo((lt-.15-k*.07)/.3);
    return `<span class="w serif" style="opacity:${p};transform:translateY(${(1-p)*40}px);background-size:${m?eo((lt-.45-k*.07)/.35)*100:0}% 30%">${esc(w.replace(/\*\*/g,''))}</span>`}).join('');
  return `<div class="lbl" style="font-size:${b.label.replace(/\*/g,'').length>16?104:132}px">${ws}</div>`;
}
function sceneHTML(b,lt){
  const S=Object.assign({zoom:ZOOM[b.scene]||1},SC[b.scene]||SC.question), d=S.draw(b,lt), cam=1+.045*eio(P(lt,0,b.dur+.4)), boil='boil'+(Math.floor((b.start+lt)*8)%3);
  return `<div class="layer" style="background:${b.plane}"></div>
    <div class="layer" style="transform:scale(${cam});transform-origin:540px 1050px">
      <svg class="abs" style="left:0;top:0" width="1080" height="1920" viewBox="0 0 1080 1920"><g filter="url(#${boil})"><g transform="translate(540 1010) scale(${S.zoom||1}) translate(-540 -1050)">${d.svg||''}</g></g></svg>${d.html||''}
    </div>${labelHTML(b,lt)}`;
}
window.render=function(t){
  const i=idx(t), b=SCN[i], lt=t-b.start, IR=.42;
  const inT=i>0&&lt<IR;
  if(inT){ const pb=SCN[i-1]; $('A').innerHTML=sceneHTML(pb,t-pb.start); $('A').style.display='block'; }
  else $('A').style.display='none';
  $('B').innerHTML=sceneHTML(b,lt);
  const r=inT?eio(lt/IR)*1250:2000; $('B').style.clipPath=`circle(${r}px at 540px 1050px)`;
  // captions: words light up as spoken
  const cap=$('cap'); if(cap.dataset.k!==String(i)){cap.dataset.k=i; cap.innerHTML=b.say.split(' ').map(w=>`<span>${esc(w)} </span>`).join('');}
  const ws=cap.querySelectorAll('span'), sp=P(t,b.start,b.start+(b.speech||b.dur)*.95);
  ws.forEach((w,j)=>{w.style.color=j/ws.length<=sp?INK:'#B9B1A3';});
};
</script></body></html>
